name: Simulator checks
on:
  push:
    branches: [main, feature/driving-simulator]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rules and physics
        run: npm test
      - name: Build offline extension
        run: npm run build
      - name: Verify and load the downloadable installation ZIP
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          source = pathlib.Path("extension")
          destination = pathlib.Path("dist/extension")
          with zipfile.ZipFile("install/pdd-driving-simulator.zip") as archive:
              assert archive.testzip() is None, "ZIP CRC failed"
              names = archive.namelist()
              assert "manifest.json" in names, "Manifest must be at archive root"
              assert all("/" not in name and "\\\\" not in name for name in names), "Unexpected nested folder"
              assert set(names) == {p.name for p in source.iterdir() if p.is_file()}
              for name in names:
                  assert archive.read(name) == (source / name).read_bytes(), name + " differs from source"
              archive.extractall(destination)
          print("INSTALL ZIP PASS: 11 root files; manifest at root; CRC valid; source bytes match")
          PY
      - name: Install browser test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Drive full route with keyboard in offline extension
        run: npm run test:browser
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - name: Package extension
        if: always()
        run: cd dist/extension && zip -r ../../artifacts/pdd-driving-simulator.zip .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-evidence-${{ matrix.browser }}
          path: |
            artifacts/*.png
            artifacts/*.jpg
            artifacts/*.json
            artifacts/*.zip
          retention-days: 14
