name: Simulator checks
on:
  push:
    branches: [main, feature/driving-simulator]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Install OSM extract tool
        run: sudo apt-get update -qq && sudo apt-get install -y osmium-tool
      - run: npm run build
      - name: Package and extract actual installer
        run: |
          mkdir -p artifacts
          cd dist/extension
          zip -qr ../../artifacts/pdd-driving-simulator.zip .
          cd ../..
          python3 - <<'PY'
          import zipfile, pathlib, shutil
          with zipfile.ZipFile('artifacts/pdd-driving-simulator.zip') as z:
              assert z.testzip() is None
              assert 'manifest.json' in z.namelist()
              assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist())
              shutil.rmtree('dist/extension')
              z.extractall('dist/extension')
              print('INSTALL ZIP PASS: root manifest, CRC valid, extracted for browser test')
          PY
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify Moscow offline and custom area import
        run: node tests/map-browser.mjs
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-evidence-${{ matrix.browser }}
          path: |
            artifacts/*.png
            artifacts/*.jpg
            artifacts/*.html
            artifacts/*.json
            artifacts/*.zip
          retention-days: 14
