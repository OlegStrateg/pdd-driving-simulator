name: Simulator checks
on:
  push:
    branches: [main, feature/driving-simulator]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Package and extract actual installer
        run: |
          mkdir -p artifacts
          cd dist/extension
          zip -qr ../../artifacts/pdd-driving-simulator.zip .
          cd ../..
          python3 - <<'PY'
          import zipfile, pathlib, shutil
          with zipfile.ZipFile('artifacts/pdd-driving-simulator.zip') as z:
              assert z.testzip() is None
              assert 'manifest.json' in z.namelist()
              assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist())
              shutil.rmtree('dist/extension')
              z.extractall('dist/extension')
              print('INSTALL ZIP PASS: root manifest, CRC valid, extracted for browser test')
          PY
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-evidence-${{ matrix.browser }}
          path: |
            artifacts/*.png
            artifacts/*.jpg
            artifacts/*.html
            artifacts/*.json
            artifacts/*.zip
          retention-days: 14
  release:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simulator-evidence-chrome
          path: package
      - name: Publish tested installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          gh release create "preview-${COMMIT:0:12}" package/pdd-driving-simulator.zip package/01b-3d.png package/browser-summary.json --target "$COMMIT" --prerelease --title "3D preview ${COMMIT:0:12}" --notes "Babylon.js renderer, bundled Car Concept model, local textures, coordinate-based OpenStreetMap area loading. Automated Chrome and Chromium checks passed. Real-place mode has no verified traffic-rule assessment."
